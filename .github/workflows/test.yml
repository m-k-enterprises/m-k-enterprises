name: CI

on:
  pull_request:
  push:
    branches: [ work ]

jobs:
  test:
    runs-on: blacksmith-2vcpu-ubuntu-2404
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: yarn
      - run: corepack enable
      - run: yarn install --immutable
      - run: CI=true yarn test --coverage
