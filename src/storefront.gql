{
  shop {
    id
    name
    shipsToCountries
    primaryDomain {
      url
    }
    brand {
      slogan
      shortDescription
      # Image URLs:
      # - url: original, unmodified source image (full-resolution; use for exports/reprocessing, not direct UI rendering)
      # - displayUrl: transformed/optimized image for UI rendering (maxWidth 2880px; preserves aspect ratio; height scales automatically)
      # - width/height: dimensions of the returned image after transforms
      # We keep both to avoid repeated transforms in the UI while still preserving access to the original source image when needed.
      logo {
        image {
          altText
          url
          displayUrl: url(transform: {maxWidth: 2880})
          width
          height
        }
      }
      # Use `squareLogo` when the container has a 1:1 (square) aspect ratio (e.g., avatars, app icons, profile images).
      # Use `logo` when the container is not 1:1—especially wider than tall (e.g., headers, navigation bars, banners)—and as the default elsewhere.
      # In short: squareLogo → square containers; logo → non-square containers (preferably wide).
      squareLogo {
        image {
          altText
          url
          displayUrl: url(transform: {maxWidth: 2880})
          width
          height
        }
      }
      colors {
        primary {
          background
          foreground
        }
      }
      coverImage {
        image {
          altText
          url
          heroUrl: url(transform: {crop: CENTER, maxWidth: 5760, maxHeight: 3240})
          width
          height
        }
      }
    }
  }
  articles(first: 6, sortKey: PUBLISHED_AT, reverse: true) {
    nodes {
      id
      title
      onlineStoreUrl
      handle
      excerpt
      excerptHtml
      image {
        altText
        url
        cardImageUrl: url(transform: {crop: CENTER, maxWidth: 1920, maxHeight: 1080})
        width
        height
      }
      publishedAt
    }
  }
}
