{
  shop {
    id
    name
    shipsToCountries
    primaryDomain {
      url
    }
    brand {
      slogan
      shortDescription
      logo {
        image {
          altText
          # url: original, full-resolution source image (avoid direct UI rendering; use for downloads or high-res previews; prefer displayUrl in UI)
          url
          # displayUrl: transformed/optimized image for UI rendering (maxWidth 2880px; Shopify transforms preserve aspect ratio, so height scales automatically)
          displayUrl: url(transform: {maxWidth: 2880})
          # width/height: dimensions of the returned image after transforms
          width
          height
        }
      }
      # squareLogo: use for 1:1 (square) contexts (e.g., avatars, app icons, profile images)
      squareLogo {
        image {
          altText
          # url: original, full-resolution source image (avoid direct UI rendering; use for downloads or high-res previews; prefer displayUrl in UI)
          url
          # displayUrl: transformed/optimized image for UI rendering (maxWidth 2880px; Shopify transforms preserve aspect ratio, so height scales automatically)
          displayUrl: url(transform: {maxWidth: 2880})
          # width/height: dimensions of the returned image after transforms
          width
          height
        }
      }
      colors {
        primary {
          background
          foreground
        }
      }
      coverImage {
        image {
          altText
          url
          heroUrl: url(transform: {crop: CENTER, maxWidth: 5760, maxHeight: 3240})
          width
          height
        }
      }
    }
  }
  articles(first: 6, sortKey: PUBLISHED_AT, reverse: true) {
    nodes {
      id
      title
      onlineStoreUrl
      handle
      excerpt
      excerptHtml
      image {
        altText
        url
        cardImageUrl: url(transform: {crop: CENTER, maxWidth: 1920, maxHeight: 1080})
        width
        height
      }
      publishedAt
    }
  }
}
